name: Docker Image CI

on:
  push:
    branches: [ "DevOps" ]
  pull_request:
    branches: [ "DevOps" ]

env:
  APP_NAME: bankapp
  ACR_NAME: megaprojectacr
  COMPOSE_FILE: docker-compose.yml

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      # --- STEP 1: Checkout code ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- STEP 2: Install Docker Compose ---
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      # --- STEP 3: Set up Docker Buildx ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # --- STEP 4: Build Docker image ---
      - name: Build with Docker
        run: |
          docker build -t ${{ env.APP_NAME }}:latest .
          docker tag ${{ env.APP_NAME }}:latest ${{ env.APP_NAME }}:${{ github.sha }}
      
      # --- STEP 5: Run tests using Docker Compose ---
      - name: Start services and run tests
        run: |
          docker-compose -f ${{ env.COMPOSE_FILE }} up -d --build
          docker-compose -f ${{ env.COMPOSE_FILE }} exec app ./run-tests.sh || echo "Tests failed"
          docker-compose -f ${{ env.COMPOSE_FILE }} down


      # --- STEP 7: Login to ACR ---
      - name: Login to ACR
        if: github.ref == 'refs/heads/DevOps'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # --- STEP 8: Push to ACR ---
      - name: Push to Azure Container Registry
        if: github.ref == 'refs/heads/DevOps'
        run: |
          docker tag ${{ env.APP_NAME }}:latest ${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ github.sha }}