name: Docker Image CI

on:
  push:
    branches: [ "DevOps" ]
  pull_request:
    branches: [ "DevOps" ]

env:
  APP_NAME: bankapp
  ACR_NAME: megaprojectacr
  COMPOSE_FILE: docker-compose.yml

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      # --- STEP 1: Checkout code ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- STEP 2: Set up Docker Buildx ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # --- STEP 3: Build Docker image ---
      - name: Build with Docker
        run: |
          docker build -t ${{ env.APP_NAME }}:latest .
          docker tag ${{ env.APP_NAME }}:latest ${{ env.APP_NAME }}:${{ github.sha }}
      
      # Run tests using Docker Compose
      - name: Start services and run tests
        run: |
          docker-compose -f ${{ env.COMPOSE_FILE }} up -d
          docker-compose -f ${{ env.COMPOSE_FILE }} exec app ./run-tests.sh
          docker-compose -f ${{ env.COMPOSE_FILE }} down

      # SonarQube Analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # --- STEP 4: Login to Azure Container Registry ---
      - name: Login to ACR
        if: github.ref == 'refs/heads/DevOps'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # --- STEP 5: Push to ACR ---
      - name: Push to Azure Container Registry
        if: github.ref == 'refs/heads/DevOps'
        run: |
          docker tag ${{ env.APP_NAME }}:latest ${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ github.sha }}
